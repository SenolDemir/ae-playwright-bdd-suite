name: playwright BDD e2e sharded pipeline

on:
  workflow_dispatch:
  # pull_request:
  #   branches: [main, develop]
  # schedule:
  #   - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_URL: ${{ vars.BASE_URL || 'https://www.automationexercise.com/' }}
  API_BASE_URL: ${{ vars.API_BASE_URL || 'https://www.automationexercise.com/api/' }}
  BROWSER_TYPE: ${{ vars.BROWSER_TYPE || 'chrome' }}
  TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
  TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

jobs:
  sharded-tests:
    name: Test shard (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4, 5]
        shardTotal: [5]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare .env
        run: cp .env.example .env || true

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install OS dependencies only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

        # Runs: npx bddgen && npx playwright test --shard=X/5
      - name: Run tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: npm run test:sharded -- ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload blob report (shard ${{ matrix.shardIndex }})
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 1

  merge-reports:
    if: ${{ !cancelled() }}
    needs: [sharded-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"
 
      - name: Install dependencies
        run: npm ci
 
      # --- CONSOLIDATE PLAYWRIGHT HTML REPORT ---
      - name: Download all Blob Artifacts
        uses: actions/download-artifact@v4
        with:
          path: merged-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge Playwright Blobs to HTML Report
        run: npx playwright merge-reports ./merged-blob-reports --reporter html

      - name: Upload Unified Playwright HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: HTML-Playwright-Report
          path: playwright-report/
          retention-days: 14
 
  
    
