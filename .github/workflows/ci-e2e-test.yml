name: playwright e2e test

on:
  workflow_dispatch:
  # pull_request:
  #   branches: [main]
  # schedule:
  #   - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
permissions:
  contents: read

jobs:
  playwright-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ vars.BASE_URL || 'https://www.automationexercise.com/'}}
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://www.automationexercise.com/api/' }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install OS dependencies only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Run UI tests
        run: npm run tests

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: reports/playwright-html
          retention-days: 30

      - name: Upload Allure raw results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-results
          path: reports/allure-results/
          retention-days: 30

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npx allure-commandline generate reports/allure-results --output reports/allure-report --clean
      - name: Upload Allure report for GitHub Pages

        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/allure-report

  deploy-allure:
    needs: playwright-tests
    if: ${{ !cancelled() && needs.playwright-tests.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
  steps:
    - name: Deploy Allure report to GitHub Pages
  id: deployment
  uses: actions/deploy-pages@v4
