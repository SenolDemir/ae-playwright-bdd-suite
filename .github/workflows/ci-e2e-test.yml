name: Build and Run e2e tests

on:
  workflow_dispatch:
  # pull_request:
  #   branches: [main]
  # schedule:
  #   - cron: "0 3 * * *":

permissions:
  contents: read
 
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

    
jobs:
  playwright-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      BASE_URL:  ${{ vars.BASE_URL || 'https://www.automationexercise.com/'}}
      BROWSER_TYPE: ${{ vars.BROWSER_TYPE || 'chromium'}}
     
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare .env
        run: cp .env.example .env || true

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
 
      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
 
      - name: Install OS dependencies only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps
      
      - name: Run all tests (UI + API)
        run: npm run tests

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
 
      - name: Upload Allure raw results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-results
          path: reports/allure-results/
          retention-days: 30
 
      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npx allure generate reports/allure-results --clean -o reports/allure-report
 
      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-report
          path: reports/allure-report/
          retention-days: 30

  

    
